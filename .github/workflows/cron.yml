name: Cron (hold expiry + outbox drain + session generation)

# Vercel Hobby only allows daily crons; this drives the real cadence.
# The daily Vercel cron in apps/web/vercel.json remains as a backstop.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Hit cron endpoint
        run: |
          curl -sf -X POST "https://plunj-booking.vercel.app/book/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            | head -c 500
